version: '3.8'

# Development Docker Compose with live code mounting and hot reloading
services:
  lms-app-dev:
    image: node:22-alpine
    container_name: lms-assuyutiyah-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: sh -c "npm install && npm run dev"
