<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Ornate Islamic Octagram / Rub el Hizb Border in gold -->
  <g transform="translate(256,236)" filter="url(#shadow)">
    <!-- Rotating 8-point star background accent -->
    <rect x="-140" y="-140" width="280" height="280" rx="36" fill="#022c22" stroke="url(#goldGrad)" stroke-width="6"/>
    <rect x="-140" y="-140" width="280" height="280" rx="36" transform="rotate(45)" fill="#022c22" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9"/>

    <!-- Central emblem circle -->
    <circle r="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Open Quran / Book Icon -->
    <path d="M-60,-20 C-30,-35 -10,-25 0,-10 C10,-25 30,-35 60,-20 L60,40 C30,25 10,35 0,50 C-10,35 -30,25 -60,40 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <path d="M0,-10 L0,50" stroke="#78350f" stroke-width="3"/>
    
    <!-- Sunrays / Nur Sparkle -->
    <polygon points="0,-75 10,-55 30,-60 18,-42 32,-30 12,-30 0,-15 -12,-30 -32,-30 -18,-42 -30,-60 -10,-55" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-60" r="10" fill="#fef08a"/>
    <polygon points="0,-70 3,-63 10,-60 3,-57 0,-50 -3,-57 -10,-60 -3,-63" fill="#ffffff"/>
  </g>

  <!-- Banner Text at bottom -->
  <g transform="translate(256,430)">
    <rect x="-170" y="-22" width="340" height="44" rx="14" fill="#022c22" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <text text-anchor="middle" y="7" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#fef08a" letter-spacing="2">MI ASSUYUTIYAH</text>
  </g>
</svg>
